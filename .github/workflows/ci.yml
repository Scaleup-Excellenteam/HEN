name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version and two current ones. Installing the full
        # runtime requirements here also validates numpy/pydivsufsort wheel
        # availability early (design review ss7).
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          # The program supports Linux, macOS and Windows. What differs between
          # them is the cache's durable-write path and reading memory use, and
          # neither varies by interpreter version, so one Python each is enough
          # to catch a regression there without tripling the matrix.
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
